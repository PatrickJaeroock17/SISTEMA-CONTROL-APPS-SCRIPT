<style>
:root{
  --navy:#0B1F4B; --navy2:#13306e; --blue:#1E6BFF; --blue-l:#e8f0ff; --yellow:#FFC400; --yellow-l:#fff6d6;
  --white:#fff; --bg:#f3f6fb; --ink:#14213d; --muted:#5b6785; --line:#d9e1ef;
  --ok:#0f9d58; --ok-l:#e3f6ec; --warn:#b26a00; --warn-l:#fff3dc; --err:#d93025; --err-l:#fde8e6;
  --r:12px; --sh:0 2px 10px rgba(11,31,75,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
.top{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;gap:10px;border-bottom:4px solid var(--yellow);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{background:var(--yellow);color:var(--navy);font-weight:900;border-radius:8px;padding:6px 8px;letter-spacing:.5px}
.brand-title{font-weight:800;font-size:17px}
.brand-sub{font-size:12px;opacity:.8}
.user{display:flex;align-items:center;gap:8px;font-size:13px}
.role{background:var(--blue);border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700}
.tabs{display:flex;gap:4px;background:var(--navy2);padding:6px 10px;overflow-x:auto;position:sticky;top:0;z-index:5}
.tabs button{background:transparent;color:#cfe0ff;border:0;padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--yellow);color:var(--navy)}
main{max-width:1200px;margin:0 auto;padding:16px}
.loading{padding:40px;text-align:center;color:var(--muted)}
h2{margin:4px 0 12px;font-size:20px;color:var(--navy)}
h3{margin:0 0 10px;font-size:16px;color:var(--navy)}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
label .req{color:var(--err)}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.btn.warn{background:var(--yellow);color:var(--navy)}
.btn.danger{background:var(--err)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.xl{padding:20px;font-size:22px;width:100%;border-radius:14px}
.kpi{background:#fff;border-radius:var(--r);padding:14px;border:1px solid var(--line);box-shadow:var(--sh)}
.kpi .v{font-size:26px;font-weight:800;color:var(--navy)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.kpi.money .v{color:var(--ok)} .kpi.pend .v{color:var(--warn)}
.sect{font-size:12px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--blue-l);color:var(--navy);text-align:left;padding:8px;font-size:12px;white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fafcff}
.b{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b.DISPONIBLE{background:#eef1f6;color:#4a5578} .b.VENDIDO{background:var(--blue-l);color:var(--blue)}
.b.ANULADO,.b.REVERTIDO{background:var(--err-l);color:var(--err)} .b.PAGADO,.b.ENTREGADO{background:var(--ok-l);color:var(--ok)}
.b.PENDIENTE,.b.POR_RECOGER{background:var(--warn-l);color:var(--warn)} .b.DEMO{background:#f1e7ff;color:#6b2fbf}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--blue-l);color:var(--navy);border-radius:20px;padding:6px 10px;font-weight:700;display:flex;gap:6px;align-items:center}
.chip button{border:0;background:transparent;color:var(--err);font-weight:900;cursor:pointer;font-size:15px}
.total{font-size:22px;font-weight:800;color:var(--navy)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on.PAGADO{background:var(--ok);color:#fff} .seg button.on.PENDIENTE{background:var(--yellow);color:var(--navy)}
.alert{border-radius:10px;padding:10px 12px;margin:8px 0;font-weight:600;white-space:pre-line}
.alert.ok{background:var(--ok-l);color:var(--ok)} .alert.warn{background:var(--warn-l);color:var(--warn)}
.alert.err{background:var(--err-l);color:var(--err)} .alert.info{background:var(--blue-l);color:var(--navy)}
/* Entregas */
.ent-wrap{max-width:560px;margin:0 auto}
.ent-input{font-size:34px;text-align:center;font-weight:800;letter-spacing:2px;padding:14px;border-width:2px}
.verdict{border-radius:16px;padding:18px;margin:14px 0;border:3px solid}
.verdict .big{font-size:22px;font-weight:900;margin-bottom:6px}
.verdict.OK{background:var(--ok-l);border-color:var(--ok);color:#0b5e36}
.verdict.BAD{background:var(--err-l);border-color:var(--err);color:#8c1d16}
.verdict.PEND{background:var(--warn-l);border-color:var(--yellow);color:#6b4200}
.verdict dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:16px;color:var(--ink)}
.verdict dt{font-weight:700;color:var(--muted)} .verdict dd{margin:0;font-weight:700}
.list-mini{font-size:13px} .list-mini div{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
/* Barras */
.bar{background:#eef1f6;border-radius:6px;height:8px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--blue)}
/* Toasts y modal */
#toasts{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:92vw}
.toast{padding:12px 14px;border-radius:10px;color:#fff;font-weight:600;box-shadow:var(--sh);white-space:pre-line;max-width:420px}
.toast.ok{background:var(--ok)} .toast.err{background:var(--err)} .toast.warn{background:var(--warn)} .toast.info{background:var(--navy)}
.modal-bg{position:fixed;inset:0;background:rgba(11,31,75,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:12px}
.modal-bg[hidden]{display:none}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:18px;max-height:90vh;overflow:auto}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.right{text-align:right} .mt{margin-top:10px} .hide{display:none!important}
.login{max-width:400px;margin:30px auto}
@media (max-width:600px){ main{padding:10px} .kpi .v{font-size:22px} .brand-sub{display:none} }
@media print{ .top,.tabs,.noprint,#toasts{display:none!important} body{background:#fff} .card{box-shadow:none;border:0;padding:0} table{font-size:11px} }
</style>
